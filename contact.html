<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Photography Portfolio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&amp;display=swap">
  <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <a class="logo" href="index.html"><span>PP</span> Photography Portfolio</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact</h1>
    <p>GitHub: <a href="https://github.com/Eralyy">Eralyy</a></p>
    <p>Demo form. The browser checks the fields. No message is sent.</p>
    <form id="contact-form" action="contact.html#contact-form" method="get">
      <label for="full-name">Name</label>
      <input type="text" id="full-name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="4" required></textarea>

      <button type="submit" class="btn btn-outline-secondary btn-sm mt-3">Check form</button>
    </form>
  </main>

  <footer>
    <div class="container text-center">
      <p>Contact: <a href="https://github.com/Eralyy">Eralyy on GitHub</a></p>
      <p>&copy; 2026 Photography Portfolio</p>
      <p><a href="https://github.com/Eralyy">GitHub</a> | <a href="https://unsplash.com/">Unsplash</a></p>
    </div>
  </footer>
</body>
</html>
